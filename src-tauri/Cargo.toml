[package]
name = "viethoagame-manager"
version = "0.1.0"
description = "Quản lý và cài đặt việt hóa game"
authors = ["Viethoagame Team"]
edition = "2021"

[lib]
name = "viethoagame_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-http = "=2.8.3"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-os = "=2.4.0"
tauri-plugin-process = "=2.4.0"
tauri-plugin-shell = "=2.5.0"
tauri-plugin-store = "=2.5.0"
tauri-plugin-updater = "=2.14.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "gzip", "json"] }

rusqlite = { version = "0.32", features = ["bundled"] }

sha2 = "0.10"
hex = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

walkdir = "2.5"
glob = "0.3"

keyring = { version = "3.0", features = ["windows-native"] }

dirs = "5.0"  # Cross-platform user dirs

anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"

winreg = "0.52"  # Đọc registry Windows
sysinfo = "0.32" # Thông tin hệ thống

once_cell = "1.20"  # Lazy static
futures-util = "0.3"  # Stream extensions
uuid = { version = "1.10", features = ["v4"] }

[features]
# Mặc định - gọn nhẹ
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
